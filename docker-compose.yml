services:
  mysql:
    image: mysql:8.0
    container_name: webrtc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      MYSQL_DATABASE: webrtc_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./webrtc-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc-network

  webrtc-service:
    build:
      context: ./webrtc-service
      dockerfile: Dockerfile
    container_name: webrtc-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/webrtc_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root123456}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webrtc-network

  webrtc:
    build:
      context: ./webrtc
      dockerfile: Dockerfile
    container_name: webrtc-frontend
    ports:
      - "8081:80"
    depends_on:
      - webrtc-service
    networks:
      - webrtc-network

volumes:
  mysql_data:

networks:
  webrtc-network:
    driver: bridge
